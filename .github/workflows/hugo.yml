name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  HUGO_VERSION: 0.147.9

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout repository and pinned PaperMod theme
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Install Hugo and verify official checksum
        shell: bash
        run: |
          set -euo pipefail
          archive="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          release="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          download_dir="${RUNNER_TEMP}/hugo-download"
          binary_dir="${RUNNER_TEMP}/hugo-bin"
          mkdir -p "${download_dir}" "${binary_dir}"
          cd "${download_dir}"
          curl --fail --location --retry 3 --output "${archive}" "${release}/${archive}"
          curl --fail --location --retry 3 --output checksums.txt "${release}/hugo_${HUGO_VERSION}_checksums.txt"
          awk -v archive="${archive}" '$2 == archive { print }' checksums.txt > selected-checksum.txt
          test "$(wc -l < selected-checksum.txt)" -eq 1
          sha256sum --check --strict selected-checksum.txt
          tar -xzf "${archive}" -C "${binary_dir}" hugo
          echo "${binary_dir}" >> "${GITHUB_PATH}"

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build site for the repository Pages URL
        env:
          HUGO_ENVIRONMENT: production
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          TZ: Asia/Tokyo
        run: hugo --gc --minify --baseURL "${PAGES_BASE_URL%/}/"

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
